[tool.coverage.run]
branch = true
source = [ "src" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = """
 --cov
 --cov-report html:'../../coverage/libs/db/html'
 --cov-report xml:'../../coverage/libs/db/coverage.xml'
 --html='../../reports/libs/db/unittests/html/index.html'
 --junitxml='../../reports/libs/db/unittests/junit.xml'
"""

[project]
name = "trader-db"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.12,<3.13"
readme = 'README.md'
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.1",
]


[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
  "pyright>=1.1.414",
  "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/trader_db/migrations"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff.lint.per-file-ignores]
"src/trader_db/migrations/versions/*" = ["E501"]
