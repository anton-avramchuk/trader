[tool.coverage.run]
branch = true
source = [ "src" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/importer/html'
 --cov-report xml:'../../coverage/apps/importer/coverage.xml'
 --html='../../reports/apps/importer/unittests/html/index.html'
 --junitxml='../../reports/apps/importer/unittests/junit.xml'
"""

[project]
name = "trader-importer"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.12,<3.13"
readme = 'README.md'
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
  "pyright>=1.1.414",
  "httpx2>=2.13.1",
  "hypothesis>=6.168.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]

line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []

fixable = ["ALL"]
unfixable = []

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
